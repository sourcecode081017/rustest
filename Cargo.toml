[package]
name = "rustest"
version = "0.1.0"
edition = "2021"
description = "A fast, minimalist API testing tool written in Rust."
license = "MIT"
repository = "https://github.com/sourcecode081017/rustest"
default-run = "rustest"

[[bin]]
name = "rustest"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "deflate", "rustls-tls", "charset", "http2"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
